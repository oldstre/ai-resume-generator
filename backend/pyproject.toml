[project]
name = "ai-resume-backend"
version = "0.1.0"
description = "AI Resume Generator API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "redis",
    "python-dotenv",
    "markdown-it-py>=4.2.0",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.32",
    "langchain-core>=1",
    "langchain-openai>=1",
    "langgraph>=1",
    "arq>=0.26",
    "httpx[socks]>=0.28.1",
    "reportlab>=5.0.0",   #简历 PDF 要用
    "tavily-python>=0.5.0",
    "langsmith>=0.1.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg-pool>=3.3.3",
    "pgvector>=0.3.0",
    "pyjwt>=2.14.0",
    "bcrypt>=4.0",
    "email-validator>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
